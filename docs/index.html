
#<!--
# ============================================================
#
#   ed / portable Emacs
#   Bootstrap installer for Windows
#
#   Source:
#   https://github.com/dzharii/ed-is-my-portable-emacs
#
#   Usage:
#   iex (iwr -UseBasicParsing 'https://ed.awwtools.com/').Content
#
# ============================================================

$ErrorActionPreference = 'Stop'

Write-Host ''
Write-Host '  ed / portable Emacs' -ForegroundColor Cyan
Write-Host '  Installation bootstrap'
Write-Host ''

# 01 / Check prerequisites

if (-not (Get-Command git.exe -ErrorAction SilentlyContinue)) {
    throw 'Git for Windows is required: https://git-scm.com/downloads/win'
}

# 02 / Select installation directory

$repository = 'https://github.com/dzharii/ed-is-my-portable-emacs.git'
$defaultPath = Join-Path $HOME 'ed'

$destination = Read-Host "Install location [$defaultPath]"

if ([string]::IsNullOrWhiteSpace($destination)) {
    $destination = $defaultPath
}

$destination = [IO.Path]::GetFullPath(
    [Environment]::ExpandEnvironmentVariables($destination)
)

# 03 / Clone repository, or reuse an existing checkout

if (Test-Path -LiteralPath $destination) {
    $gitDir = Join-Path $destination '.git'

    if (-not (Test-Path -LiteralPath $gitDir)) {
        throw "Directory exists but is not a Git checkout: $destination"
    }

    $origin = & git -C $destination remote get-url origin

    if ($LASTEXITCODE -ne 0 -or
        $origin -notin @(
            $repository,
            'https://github.com/dzharii/ed-is-my-portable-emacs',
            'git@github.com:dzharii/ed-is-my-portable-emacs.git'
        )) {
        throw "Existing checkout has an unexpected origin: $destination"
    }

    Write-Host 'Existing checkout found. Reusing it.'
}
else {
    & git clone $repository $destination

    if ($LASTEXITCODE -ne 0) {
        throw 'Git clone failed.'
    }
}

# 04 / Offer to register the launcher in user PATH

& (Join-Path $destination 'add-to-path.cmd')

if ($LASTEXITCODE -notin @(0, 2)) {
    throw 'PATH setup failed.'
}

# 05 / Launch ed; its installer handles Emacs

Write-Host 'Launching ed...' -ForegroundColor Cyan

& (Join-Path $destination 'ed.cmd')

#-->
<#
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width,initial-scale=1">

  <title>ed / portable Emacs</title>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const style = document.createElement('link');
      style.rel = 'stylesheet';
      style.href = 'style.css';
      document.head.append(style);

      document.title = 'ed / portable Emacs';

      const main = document.createElement('main');
      main.className = 'page-shell';

      main.innerHTML = `
        <section class="hero">
          <p class="kicker">Portable Emacs for Windows</p>
          <h1>ed</h1>
          <p class="lede">
            A portable editor that installs itself.
          </p>

          <h2>Install</h2>

          <pre><code>iex (iwr -UseBasicParsing
  'https://ed.awwtools.com/').Content</code></pre>

          <p>
            Requires Git for Windows. The installer
            clones the repository, offers PATH setup,
            and launches Emacs.
          </p>

          <nav>
            <a href="https://github.com/dzharii/ed-is-my-portable-emacs">
              Source code
            </a>
            <a href="https://github.com/dzharii/ed-is-my-portable-emacs#readme">
              Documentation
            </a>

        </section>

      document.body.replaceChildren(main);
    });
