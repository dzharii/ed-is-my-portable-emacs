#<!--
# ============================================================
#
#   ed / portable Emacs
#   Bootstrap installer for Windows
#
#   Source: https://github.com/dzharii/ed-is-my-portable-emacs
#   Run:    iex (iwr -UseBasicParsing 'https://ed.awwtools.com/').Content
#
#   This installer always makes a NEW clone in the current folder.
#   It never reuses, modifies, or updates existing checkouts.
#
# ============================================================

$ErrorActionPreference = 'Stop'

Write-Host ''
Write-Host '  ed / portable Emacs' -ForegroundColor Cyan
Write-Host '  Installation bootstrap' -ForegroundColor Cyan
Write-Host ''

# 01 / Check Windows, Git, and the current directory.

if ($env:OS -ne 'Windows_NT') { throw 'Run this installer in PowerShell on Windows.' }
if ((Get-Location).Provider.Name -ne 'FileSystem') { throw 'Run this installer from a filesystem directory.' }
if (-not (Get-Command git.exe -ErrorAction SilentlyContinue)) { throw 'Git for Windows is required: https://git-scm.com/downloads/win' }

$currentDirectory = [IO.Path]::GetFullPath((Get-Location).ProviderPath).TrimEnd([char]92, [char]47)
$driveRoot = [IO.Path]::GetPathRoot($currentDirectory).TrimEnd([char]92, [char]47)
if ($currentDirectory.Equals($driveRoot, [StringComparison]::OrdinalIgnoreCase)) { throw 'Choose a normal working directory instead of a drive root, then retry.' }

foreach ($root in @($env:WINDIR, $env:ProgramFiles, ${env:ProgramFiles(x86)}, $env:ProgramData)) {
    if ([string]::IsNullOrWhiteSpace($root)) { continue }
    $protected = [IO.Path]::GetFullPath($root).TrimEnd([char]92, [char]47)
    if ($currentDirectory.Equals($protected, [StringComparison]::OrdinalIgnoreCase) -or $currentDirectory.StartsWith($protected + '\', [StringComparison]::OrdinalIgnoreCase)) { throw "The current directory is a protected Windows location: $currentDirectory. Change to a user-owned directory and retry." }
}

# 02 / Choose the name of a NEW child folder in the current directory.

$repository = 'https://github.com/dzharii/ed-is-my-portable-emacs.git'
$folderName = 'ed-is-my-portable-emacs'
Write-Host "  Current directory: $currentDirectory"

while ($true) {
    if ($folderName -in @('.', '..') -or $folderName -match '[\\/:*?"<>|]' -or $folderName -match '[. ]$' -or $folderName -match '^(CON|PRN|AUX|NUL|COM[1-9]|LPT[1-9])(\.|$)') {
        Write-Host "  Invalid Windows folder name: $folderName" -ForegroundColor Yellow
    }
    else {
        $destination = Join-Path $currentDirectory $folderName
        if (-not (Test-Path -LiteralPath $destination)) { break }
        Write-Host "  $destination already exists. It will not be reused or modified." -ForegroundColor Yellow
    }
    $folderName = Read-Host 'Choose another folder name (blank to cancel)'
    if ([string]::IsNullOrWhiteSpace($folderName)) { Write-Host 'Installation cancelled.'; return }
}

$confirmation = Read-Host "Clone ed into '$destination'? [Y/n]"
if ($confirmation -notin @('', 'y', 'Y', 'yes', 'YES', 'Yes')) { Write-Host 'Installation cancelled.'; return }

# 03 / Clone the repository. Do not inspect or reuse existing checkouts.

& git.exe clone -- $repository $destination
if ($LASTEXITCODE -ne 0) { throw "Git clone failed: $destination" }

# 04 / Offer PATH registration and launch ed using its existing installer.

& (Join-Path $destination 'add-to-path.cmd')
if ($LASTEXITCODE -notin @(0, 2)) { throw 'PATH setup failed.' }

Write-Host 'Launching ed...' -ForegroundColor Cyan
& (Join-Path $destination 'ed.cmd')
if ($LASTEXITCODE -ne 0) { throw "ed exited with code $LASTEXITCODE." }

#-->
<#
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>ed / portable Emacs</title>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const style = document.createElement('link');
      style.rel = 'stylesheet';
      style.href = 'style.css';
      document.head.append(style);

      document.title = 'ed / portable Emacs';

      const main = document.createElement('main');
      main.className = 'page-shell';

      main.innerHTML = `
        <section class="hero">
          <p class="kicker">Portable Emacs for Windows</p>
          <h1>ed</h1>
          <p class="lede">
            A portable editor that installs itself.
          </p>

          <h2>Install</h2>

          <pre><code>iex (iwr -UseBasicParsing 'https://ed.awwtools.com/').Content</code></pre>

          <p>
            Requires Git for Windows. Run this command from your preferred working directory. The installer creates a new repository folder there, offers PATH setup, and launches Emacs.
          </p>

          <nav>
            <a href="https://github.com/dzharii/ed-is-my-portable-emacs">
              Source code
            </a>
            <a href="https://github.com/dzharii/ed-is-my-portable-emacs#readme">
              Documentation
            </a>
          </nav>
        </section>
      `;

      document.body.replaceChildren(main);
    });
  </script>
</head>
<body>
  <main id="app">
    JavaScript is required for this page.
  </main>
</body>
</html>
#>
